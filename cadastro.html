<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro</title>
    <link rel="stylesheet" href="style/Cadastro.css">
</head>
<body>
    <div class="container">
       <div class="form">
        <form action="#">
            <div class="form-header">
                <div class="title">
                    <h1>Cadastre-se</h1>
                </div>
                <div class="login-button">
                    <button><a href="index.html">Entrar</a></button>
                </div>
            </div>
            <div class=" input-group">
                <div class="input-box">
                    <label for="firstname">Primeiro Nome</label>
                    <input id="firstname" type="text" name="firstname" placeholder="Digite seu primeiro nome" required>
                </div>
                <div class="input-box">
                    <label for="lastname">Sobrenome Nome</label>
                    <input id="lastname" type="text" name="lastname" placeholder="Digite seu Sobrenome" required>
                </div>
                <div class="input-box">
                    <label for="email">Email</label>
                    <input id="email" type="text" name="email" placeholder="Digite seu Email" required>
                </div>
                <div class="input-box">
                    <label for="number">Celular</label>
                    <input id="number" type="number" name="number" placeholder="(xx) x xxxx-xxxx" required>
                </div>
                <div class="input-box">
                    <label for="password">Senha</label>
                    <input id="password" type="password" name="firstname" placeholder=" Digite sua Senha" required>
                </div>
                <div class="input-box">
                    <label for="Confirmpassword"> Confirme sua senha</label>
                    <input id="Confirmpassword" type="text" name="Confirmpassword" placeholder="Digite sua senha">
                </div>
            </div>

            <div class="gender-inputs">
                <div class="gender-title">
                    <h6>Gênero</h6>
                </div>
                <div class="gender-group">
                    <div class="gender-input">
                        <input type="radio" id="female" name="gender">
                        <label for="female">Feminino</label>
                    </div>
                    <div class="gender-input">
                        <input type="radio" id="male" name="gender">
                        <label for="male">Masculino</label>
                    </div>
                    <div class="gender-input">
                        <input type="radio" id="others" name="gender">
                        <label for="others">Outros</label>
                    </div>
                </div>

            </div>
            <div class="continue-button">
                <button><a href="#">Confirmar</a></button>
            </div>
        </form>
       </div>
    </div>
</body>
</html>
